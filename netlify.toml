[build]
  command = "npm run build"
  publish = "dist"

# Production context (main branch)
[context.production]
  command = "npm run build"

# Staging context (staging branch)
[context.staging]
  command = "npm run build"

# Deploy preview context (pull requests)
[context.deploy-preview]
  command = "npm run build"

[[redirects]]
  from = "/login"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/get-started"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/onboard"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/dashboard/*"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
